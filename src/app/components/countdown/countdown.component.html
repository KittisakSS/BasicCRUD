<div class="container mt-4">
  <div class="card">
    <div class="card-header bg-info text-white">
      <h5>🕒 เลือกเวลาสิ้นสุดเพื่อเริ่มนับถอยหลัง</h5>
    </div>
    <div class="card-body">
      <div class="form-group">
        <label>เวลาสิ้นสุด:</label>
        <input
          type="datetime-local"
          class="form-control"
          (change)="onTargetDateChange($event)"
        />
      </div>

      <div *ngIf="timeLeft" class="mt-3 alert alert-primary text-center">
        ⏳ {{ timeLeft }}
      </div>
    </div>
  </div>
</div>
